<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KeikiSpace</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--pri:#F8C8DC;--sec:#FCE4EC;--bg:#FFFBFC;--card:#fff;--acc:#C77D96;--accd:#a85f79;--tx:#493942;--mu:#8D8589;--bd:#f3dbe4;--ok:#6f9a7e;--okb:#e4f1e8;--wa:#8a6d12;--wab:#fff4c7;--da:#b4475f;--dab:#fbe1e6;--sh:0 4px 20px rgba(199,125,150,.12);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f171b;--card:#2a2026;--sec:#3a2a33;--bd:#4a3640;--tx:#f6e9ee;--mu:#b9a9b0;--pri:#8f4d68;--acc:#e8a1ba;--accd:#f3b8cd;--okb:#243a2d;--ok:#9fd1b0;--wab:#40361a;--wa:#f0d77a;--dab:#43232c;--da:#f29aab;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f171b;--card:#2a2026;--sec:#3a2a33;--bd:#4a3640;--tx:#f6e9ee;--mu:#b9a9b0;--pri:#8f4d68;--acc:#e8a1ba;--accd:#f3b8cd;--okb:#243a2d;--ok:#9fd1b0;--wab:#40361a;--wa:#f0d77a;--dab:#43232c;--da:#f29aab;--sh:none;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:500 15px/1.5 'Plus Jakarta Sans',Nunito,system-ui,sans-serif}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:600;cursor:pointer;background:var(--acc);color:#fff;transition:.2s;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{background:var(--accd);transform:translateY(-1px)}.btn:active{transform:none}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.sec{background:var(--sec);color:var(--tx);border:1px solid var(--bd)}.btn.sec:hover{background:var(--pri)}
.btn.dng{background:var(--da);color:#fff}.btn.sm{padding:6px 14px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;box-shadow:var(--sh)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.mu{color:var(--mu);font-size:13px}.big{font-size:26px;font-weight:700}
.badge{display:inline-flex;gap:4px;align-items:center;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.b-ok{background:var(--okb);color:var(--ok)}.b-wa{background:var(--wab);color:var(--wa)}.b-da{background:var(--dab);color:var(--da)}.b-mu{background:var(--sec);color:var(--mu)}
.field{display:grid;gap:4px;margin-bottom:14px}.field label{font-size:13px;font-weight:600}
input,select{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:10px 14px;width:100%;transition:.2s}
input:hover,select:hover{border-color:var(--acc)}input[aria-invalid=true]{border-color:var(--da)}
.err{color:var(--da);font-size:12px;min-height:16px}
.bar{height:10px;border-radius:99px;background:var(--sec);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .6s}
.bar i.wa{background:#e0b840}.bar i.da{background:var(--da)}
.ico{width:40px;height:40px;border-radius:14px;background:var(--sec);display:grid;place-items:center;font-size:20px;flex:none}
.row{display:flex;gap:12px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.item{padding:12px 0;border-bottom:1px dashed var(--bd)}.item:last-child{border:0}
/* shell */
#app{display:flex;min-height:100vh}
aside{width:236px;padding:24px 16px;border-right:1px solid var(--bd);background:var(--card);position:sticky;top:0;height:100vh;flex:none}
.logo{font-weight:700;font-size:20px;color:var(--accd);display:flex;gap:8px;align-items:center;padding:0 8px 24px}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:14px;color:var(--mu);text-decoration:none;font-weight:600;margin-bottom:4px;transition:.2s}
.nav a:hover{background:var(--sec);color:var(--tx)}.nav a[aria-current=page]{background:var(--pri);color:var(--tx)}
main{flex:1;min-width:0;padding:0 32px 48px;max-width:1180px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:24px 0}
.ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:16px}
.ibtn:hover{background:var(--sec)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13px}
.chip[aria-pressed=true]{background:var(--pri);border-color:var(--acc)}
.bnav{display:none}
@media (max-width:820px){aside{display:none}main{padding:0 16px 96px}
.bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:20}
.bnav a{display:grid;justify-items:center;font-size:10px;color:var(--mu);text-decoration:none;padding:4px 6px;border-radius:12px;font-weight:600}.bnav a[aria-current=page]{background:var(--pri);color:var(--tx)}}
/* landing & auth */
.land{max-width:1100px;margin:0 auto;padding:24px}
.hero{text-align:center;padding:56px 0 32px}
.hero h1{font-size:clamp(32px,6vw,56px);line-height:1.1;max-width:780px;margin:0 auto 16px}
.hero h1 em{color:var(--acc);font-style:normal}
.spark{color:var(--acc);letter-spacing:8px}
.auth{min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 20% 10%,var(--sec),transparent 50%),var(--bg)}
.auth .card{width:min(420px,100%);padding:32px}
/* modal */
dialog{border:1px solid var(--bd);border-radius:24px;padding:24px;background:var(--card);color:var(--tx);width:min(440px,calc(100% - 24px));box-shadow:0 20px 60px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(73,57,66,.4)}
#toast{position:fixed;right:16px;bottom:96px;display:grid;gap:8px;z-index:50}
.toast{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--ok);border-radius:14px;padding:10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.12);animation:pop .3s}
.toast.e{border-left-color:var(--da)}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
#tip{position:fixed;pointer-events:none;background:var(--tx);color:var(--bg);padding:4px 10px;border-radius:10px;font-size:12px;opacity:0;z-index:60;transition:opacity .15s}
.sk{height:90px;border-radius:20px;background:linear-gradient(90deg,var(--sec),var(--card),var(--sec));background-size:200%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200%}}
.view{animation:pop .35s}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;background:radial-gradient(circle at 92% 4%,var(--pri),transparent 28%),radial-gradient(circle at 4% 85%,var(--sec),transparent 34%)}
.deco{font-size:26px;letter-spacing:12px}
.empty{text-align:center;padding:40px 16px}
.sw{position:relative;width:44px;height:26px;flex:none}.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;background:var(--bd);border-radius:99px;transition:.2s}.sw span:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.sw input:checked+span{background:var(--acc)}.sw input:checked+span:after{left:21px}.sw input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="root"></div><div id="toast" aria-live="polite"></div><div id="tip"></div>
<dialog id="dlg"></dialog>
<script>
const TODAY=new Date('2026-10-31');
const CATS={Food:'🍓',Shopping:'🛍️',Transportation:'🚌',Entertainment:'🎀',Health:'🌸',Education:'📚',Utilities:'🧾',Others:'✨'};
const OLD={user:null,cur:'$',ex:[
{id:1,n:'Matcha & pastry',c:'Food',a:8.5,d:'2026-10-30'},{id:2,n:'Rose tote bag',c:'Shopping',a:42,d:'2026-10-28'},
{id:3,n:'Electricity',c:'Bills',a:61.2,d:'2026-10-26'},{id:4,n:'Movie night',c:'Fun',a:18,d:'2026-10-24'},
{id:5,n:'Bus pass',c:'Transport',a:25,d:'2026-10-20'},{id:6,n:'Groceries',c:'Food',a:74.3,d:'2026-10-18'},
{id:7,n:'Skincare set',c:'Health',a:36,d:'2026-10-12'},{id:8,n:'Internet',c:'Bills',a:39,d:'2026-10-05'}],
subs:[{id:1,n:'Streamflix',p:12.99,cy:'Monthly',nx:'2026-11-03',st:'Active',e:'🎬'},{id:2,n:'Tunebloom',p:9.99,cy:'Monthly',nx:'2026-11-12',st:'Active',e:'🎵'},
{id:3,n:'Cloudy Drive',p:29.99,cy:'Yearly',nx:'2027-02-01',st:'Active',e:'☁️'},{id:4,n:'PetalFit',p:14.5,cy:'Monthly',nx:'2026-11-04',st:'Free trial',e:'🌷'},
{id:5,n:'Inkwell Notes',p:6,cy:'Monthly',nx:'2026-11-18',st:'Free trial',e:'📓'},{id:6,n:'OldGames+',p:7.99,cy:'Monthly',nx:'—',st:'Cancelled',e:'🎮'}],
bud:{Food:200,Shopping:100,Bills:140,Fun:60,Transport:40,Health:50},
hist:[['May',310],['Jun',342],['Jul',298],['Aug',365],['Sep',330],['Oct',304]],
f:{q:'',c:'All',s:'new',sub:'All'},load:false,notif:{bill:true,trial:true,weekly:false}};
const KEY='keikispace-v1';
const S=(()=>{const d={user:null,cur:'Rp ',ex:[
{id:1,n:'Matcha & pastry',c:'Food',a:65000,d:'2026-10-30',o:'Cafe date'},{id:2,n:'Rose tote bag',c:'Shopping',a:320000,d:'2026-10-28',o:''},
{id:3,n:'Electricity',c:'Utilities',a:480000,d:'2026-10-26',o:'Monthly token'},{id:4,n:'Movie night',c:'Entertainment',a:120000,d:'2026-10-24',o:''},
{id:5,n:'Bus pass',c:'Transportation',a:150000,d:'2026-10-20',o:''},{id:6,n:'Groceries',c:'Food',a:560000,d:'2026-10-18',o:'Weekly market'},
{id:7,n:'Skincare set',c:'Health',a:275000,d:'2026-10-12',o:''},{id:8,n:'Online course',c:'Education',a:350000,d:'2026-10-08',o:'Design basics'},{id:9,n:'Internet',c:'Utilities',a:350000,d:'2026-10-05',o:''}],
subs:[{id:1,n:'Streamflix',p:169000,cy:'Monthly',nx:'2026-11-02',st:'Active',e:'🎬',k:'Entertainment'},{id:2,n:'Tunebloom',p:54990,cy:'Monthly',nx:'2026-11-06',st:'Active',e:'🎵',k:'Entertainment'},
{id:3,n:'Cloudy Drive',p:450000,cy:'Yearly',nx:'2027-02-01',st:'Active',e:'☁️',k:'Utilities'},{id:4,n:'PetalFit',p:149000,cy:'Monthly',nx:'2026-11-04',st:'Free trial',e:'🌷',k:'Health'},
{id:5,n:'Inkwell Notes',p:59000,cy:'Monthly',nx:'2026-11-18',st:'Free trial',e:'📓',k:'Education'},{id:6,n:'OldGames+',p:79000,cy:'Monthly',nx:'—',st:'Cancelled',e:'🎮',k:'Entertainment'},
{id:7,n:'Fresh Box',p:75000,cy:'Weekly',nx:'2026-11-05',st:'Active',e:'🥗',k:'Food'}],
bud:{Food:1500000,Shopping:800000,Transportation:400000,Entertainment:500000,Health:500000,Education:600000,Utilities:1000000,Others:300000},
hp:[['May',2900000],['Jun',3150000],['Jul',2750000],['Aug',3400000],['Sep',3050000]],
get hist(){return [...this.hp,['Oct',this.ex.filter(e=>e.d.startsWith('2026-10')).reduce((a,e)=>a+e.a,0)]]},
f:{q:'',c:'All',s:'new',sub:'All',m:''},load:false,notif:{bill:true,trial:true,weekly:false}};
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j)Object.assign(d,j)}catch(e){}return d})();
function save(){try{localStorage.setItem(KEY,JSON.stringify({user:S.user,cur:S.cur,ex:S.ex,subs:S.subs,bud:S.bud,notif:S.notif}))}catch(e){}}
const mc=s=>s.cy==='Weekly'?s.p*52/12:s.cy==='Yearly'?s.p/12:s.p;
const subM=()=>S.subs.filter(s=>s.st==='Active').reduce((a,s)=>a+mc(s),0);
const due=s=>{if(s.st!=='Active')return'';const d=days(s.nx);if(isNaN(d))return'';return d<=3?`<span class="badge b-da">🔴 Due ${d<=0?'now':'in '+d+' days'}</span>`:d<=7?`<span class="badge b-wa">🟡 Due in ${d} days</span>`:''};
const $=(s,r=document)=>r.querySelector(s),money=n=>S.cur==='Rp '?'Rp '+Math.round(n).toLocaleString('id-ID'):S.cur+n.toFixed(2);
const days=d=>Math.ceil((new Date(d)-TODAY)/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const spent=c=>S.ex.filter(e=>e.d.startsWith('2026-10')&&(c?e.c===c:1)).reduce((a,e)=>a+e.a,0);
const toast=(m,e)=>{const t=document.createElement('div');t.className='toast'+(e?' e':'');t.textContent=(e?'⚠ ':'✓ ')+m;$('#toast').append(t);setTimeout(()=>t.remove(),3000)};
const badge=s=>({Active:'<span class="badge b-ok">✓ Active</span>','Free trial':'<span class="badge b-wa">⏳ Free trial</span>',Cancelled:'<span class="badge b-mu">✕ Cancelled</span>'}[s]);
const NAV=[['dashboard','Dashboard','🏠'],['expenses','Expenses','🧾'],['subscriptions','Subscriptions','🔁'],['trials','Free Trials','⏳'],['budgets','Budgets','🎯'],['analytics','Analytics','📈'],['preferences','Settings','⚙️']];
/* charts */
function line(data){const W=520,H=200,p=32,mx=Math.max(...data.map(d=>d[1]))*1.15,x=i=>p+i*(W-2*p)/(data.length-1),y=v=>H-p-v/mx*(H-2*p);
return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monthly spending line chart">${[0,.5,1].map(t=>`<line x1="${p}" x2="${W-p}" y1="${H-p-t*(H-2*p)}" y2="${H-p-t*(H-2*p)}" stroke="var(--bd)" stroke-dasharray="4"/>`).join('')}
<path d="M${data.map((d,i)=>x(i)+','+y(d[1])).join('L')}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round"/>
${data.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d[1])}" r="7" fill="var(--card)" stroke="var(--acc)" stroke-width="3" tabindex="0" data-tip="${d[0]}: ${money(d[1])}"/><text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--mu)">${d[0]}</text>`).join('')}</svg>`}
const COL=['#C77D96','#F4A9C4','#e0b840','#9fc7ad','#b9a3d6','#8fb8d9'];
function donut(){const t=spent()||1,ks=Object.keys(CATS);let o=0;const r=60,C=2*Math.PI*r;
return `<div class="row wrap"><svg viewBox="0 0 160 160" width="170" role="img" aria-label="Spending by category">${ks.map((k,i)=>{const v=spent(k),l=v/t*C,s=`<circle r="${r}" cx="80" cy="80" fill="none" stroke="${COL[i]}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 80 80)" tabindex="0" data-tip="${k}: ${money(v)} (${Math.round(v/t*100)}%)"/>`;o+=l;return s}).join('')}<text x="80" y="84" text-anchor="middle" font-weight="700" fill="var(--tx)">${money(t)}</text></svg>
<ul style="list-style:none;padding:0;margin:0;display:grid;gap:4px">${ks.map((k,i)=>`<li class="mu"><span style="color:${COL[i]}">●</span> ${CATS[k]} ${k} · ${Math.round(spent(k)/t*100)}%</li>`).join('')}</ul></div>`}
function budRow(c){const b=S.bud[c],s=spent(c),p=s/b*100,k=p>=100?'da':p>=80?'wa':'';
return `<div class="item"><div class="row sp"><b>${CATS[c]} ${c}</b><span class="mu">${money(s)} / ${money(b)}</span></div><div class="bar" role="progressbar" aria-valuenow="${Math.round(p)}" aria-valuemin="0" aria-valuemax="100" style="margin:8px 0"><i class="${k}" style="width:${Math.min(p,100)}%"></i></div>
<span class="mu">${p>=100?'⚠ Over by '+money(s-b)+' — time for a gentle pause ♡':p>=80?'⚡ '+Math.round(p)+'% used — nearly at your limit':'✓ On track, '+money(b-s)+' left'}</span></div>`}
/* pages */
const P={};
P.dashboard=()=>{const tb=Object.values(S.bud).reduce((a,b)=>a+b,0),ts=spent(),act=S.subs.filter(s=>s.st==='Active').length;
const up=S.subs.filter(s=>s.st!=='Cancelled').sort((a,b)=>new Date(a.nx)-new Date(b.nx)).slice(0,4);
if(S.load)return `<div class="grid g4">${'<div class="sk"></div>'.repeat(4)}</div>`;
return `<h2 style="margin-bottom:16px">Welcome to your little money space ♡</h2>
<div class="grid g4">${[['Monthly spending',money(ts),'🌸'],['Remaining budget',money(tb-ts),'🎀'],['Active subscriptions',act+' · '+money(subM())+'/mo','🔁'],['Upcoming bills',up.length,'🗓️'],['Ongoing free trials',S.subs.filter(s=>s.st==='Free trial').length,'⏳']].map(c=>`<div class="card"><div class="row sp"><span class="mu">${c[0]}</span><span>${c[2]}</span></div><div class="big" style="margin-top:6px">${c[1]}</div></div>`).join('')}</div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Monthly spending</h3>${line(S.hist)}</div><div class="card"><h3>Budget progress</h3>${Object.keys(S.bud).slice(0,4).map(budRow).join('')}</div>
<div class="card"><h3>Recent transactions</h3>${S.ex.slice(0,4).map(exRow(0)).join('')}</div>
<div class="card"><h3>Payment reminders</h3>${up.map(s=>`<div class="item row"><div class="ico">${s.e}</div><div class="grow"><b>${s.n}</b><div class="mu">${s.nx} · in ${days(s.nx)} days</div></div>${due(s)}<b>${money(s.p)}</b></div>`).join('')}</div></div>`};
const exRow=a=>e=>`<div class="item row"><div class="ico">${CATS[e.c]}</div><div class="grow"><b>${esc(e.n)}</b><div class="mu">${e.c} · ${e.d}${e.o?' · '+esc(e.o):''}</div></div><b>−${money(e.a)}</b>${a?`<button class="ibtn" aria-label="Edit ${esc(e.n)}" onclick="exForm(${e.id})">✎</button><button class="ibtn" aria-label="Delete ${esc(e.n)}" onclick="del('ex',${e.id})">🗑</button>`:''}</div>`;
P.expenses=()=>{const f=S.f;let l=S.ex.filter(e=>(f.c==='All'||e.c===f.c)&&(!f.m||e.d.startsWith(f.m))&&e.n.toLowerCase().includes(f.q.toLowerCase()));
l.sort((a,b)=>f.s==='hi'?b.a-a.a:f.s==='lo'?a.a-b.a:new Date(b.d)-new Date(a.d));
return `<div class="row sp wrap" style="margin-bottom:16px"><div class="row wrap grow"><input id="q" placeholder="Search expenses…" aria-label="Search expenses" value="${esc(f.q)}" style="max-width:240px">
<select id="fc" aria-label="Filter by category" style="width:auto"><option>All</option>${Object.keys(CATS).map(c=>`<option ${f.c===c?'selected':''}>${c}</option>`).join('')}</select>
<select id="fs" aria-label="Sort" style="width:auto"><option value="new" ${f.s==='new'?'selected':''}>Newest</option><option value="hi" ${f.s==='hi'?'selected':''}>Highest</option><option value="lo" ${f.s==='lo'?'selected':''}>Lowest</option></select><input id="fm" type="month" aria-label="Filter by month" value="${f.m||''}" style="width:auto"></div>
<button class="btn" onclick="exForm()">＋ Add expense</button></div>
<div class="card"><div class="row sp"><span class="mu">${l.length} transactions</span><b>Total: ${money(l.reduce((a,e)=>a+e.a,0))}</b></div>${l.length?l.map(exRow(1)).join(''):`<div class="empty"><div style="font-size:40px">🌸</div><h3>${S.ex.length?'No matches':'Nothing here yet'}</h3><p class="mu" style="margin:6px 0 16px">${S.ex.length?'Try another search or filter.':'Add your first expense to start your journal.'}</p><button class="btn" onclick="exForm()">Add expense</button></div>`}</div>`};
P.subscriptions=()=>{const f=S.f.sub,l=S.subs.filter(s=>f==='All'||s.st===f);
return `<div class="row sp wrap" style="margin-bottom:16px"><div class="tabs">${['All','Active','Free trial','Cancelled'].map(t=>`<button class="chip" aria-pressed="${f===t}" onclick="S.f.sub='${t}';go()">${t}</button>`).join('')}</div><button class="btn" onclick="subForm()">＋ Add subscription</button></div>
<div class="grid g3">${l.map(s=>`<div class="card"><div class="row"><div class="ico">${s.e}</div><div class="grow"><b>${esc(s.n)}</b><div class="mu">${s.cy}</div></div>${badge(s.st)}</div>
<div class="big" style="margin:12px 0 4px">${money(s.p)}</div><div class="mu">${s.k||'Others'} · ≈ ${money(mc(s))}/mo</div><div class="mu">Next payment: ${s.nx}</div><div style="margin-top:6px">${due(s)}</div><div class="row" style="margin-top:12px"><button class="btn sec sm" onclick="subForm(${s.id})">Edit</button><button class="btn sec sm" onclick="del('subs',${s.id})">Delete</button></div></div>`).join('')||'<div class="card empty">No subscriptions in this view ♡</div>'}</div>`};
P.trials=()=>{const l=S.subs.filter(s=>s.st==='Free trial').sort((a,b)=>days(a.nx)-days(b.nx));
return `<p class="mu" style="margin-bottom:16px">Cancel before the trial ends to avoid being charged.</p><div class="grid g3">${l.map(s=>{const d=days(s.nx),soon=d<=7;return `<div class="card" style="${soon?'border:2px solid var(--da)':''}"><div class="row"><div class="ico">${s.e}</div><div class="grow"><b>${esc(s.n)}</b><div class="mu">Ends ${s.nx}</div></div></div>
<div class="big" style="margin:12px 0">${d} days left</div>${soon?'<span class="badge b-da">⚠ Ending soon</span>':'<span class="badge b-ok">✓ Plenty of time</span>'}
<div class="bar" style="margin:12px 0"><i class="${soon?'da':''}" style="width:${Math.max(5,100-d/14*100)}%"></i></div>
<div class="row"><button class="btn sm" onclick="cancelTrial(${s.id})">Cancel trial</button><button class="btn sec sm" onclick="toast('Reminder set for 2 days before ♡')">Remind me</button></div></div>`}).join('')||'<div class="card empty">No active free trials ✨</div>'}</div>`};
P.budgets=()=>{const tb=Object.values(S.bud).reduce((a,b)=>a+b,0),ts=spent();
return `<div class="card" style="margin-bottom:16px"><div class="row sp wrap"><div><span class="mu">Monthly budget</span><div class="big">${money(ts)} <span class="mu">of ${money(tb)}</span></div></div><button class="btn sec" onclick="budForm()">Edit limits</button></div>
<div class="bar" style="margin-top:12px"><i style="width:${Math.min(ts/tb*100,100)}%"></i></div></div><div class="grid g2">${Object.keys(S.bud).map(c=>`<div class="card">${budRow(c)}</div>`).join('')}</div>`};
P.analytics=()=>{const subT=subM(),h=S.hist,d=h[5][1]-h[4][1];
return `<div class="grid g2"><div class="card"><h3>Monthly expenses</h3>${line(S.hist)}</div><div class="card"><h3>Category breakdown</h3>${donut()}</div>
<div class="card"><h3>Subscription spending</h3><div class="big" style="margin:8px 0">${money(subT)}<span class="mu"> / month</span></div><p class="mu">${money(subT*12)} per year across ${S.subs.filter(s=>s.st==='Active').length} active services.</p></div>
<div class="card"><h3>Month-to-month</h3><div class="big" style="margin:8px 0">${d<0?'▼':'▲'} ${money(Math.abs(d))}</div><p class="mu">${d<0?'You spent less than September — lovely ♡':'You spent more than September.'} Estimated annual spending: ${money(h.reduce((a,x)=>a+x[1],0)/6*12)}.</p></div></div>`};
P.preferences=()=>`<div class="grid g2"><div class="card"><h3 style="margin-bottom:12px">Profile</h3><div class="field"><label for="pn">Name</label><input id="pn" value="${esc(S.user.name)}"></div><div class="field"><label for="pe">Email</label><input id="pe" value="${esc(S.user.email)}" disabled></div>
<div class="field"><label for="cu">Currency</label><select id="cu">${['$','€','£','¥','Rp '].map(c=>`<option ${S.cur===c?'selected':''}>${c}</option>`).join('')}</select></div><button class="btn" id="sv">Save changes</button></div>
<div class="card"><h3 style="margin-bottom:12px">Notifications</h3>${[['bill','Upcoming bill reminders'],['trial','Free trial ending alerts'],['weekly','Weekly summary']].map(n=>`<label class="row sp item"><span>${n[1]}</span><span class="sw"><input type="checkbox" ${S.notif[n[0]]?'checked':''} onchange="S.notif['${n[0]}']=this.checked;toast('Preference saved')"><span></span></span></label>`).join('')}
<h3 style="margin:20px 0 12px">Account & data</h3><div class="row wrap"><button class="btn sec" onclick="toast('Export ready ♡')">Export data</button><button class="btn sec" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Toggle theme</button><button class="btn dng" onclick="wipe()">Clear all data</button><button class="btn sec" onclick="S.user=null;toast('Logged out');location.hash='landing'">Log out</button></div></div></div>`;
const TITLES=Object.fromEntries(NAV.map(n=>[n[0],n[1]]));
/* actions */
function openDlg(h){const d=$('#dlg');d.innerHTML=h;d.showModal();return d}
function exForm(id){const e=S.ex.find(x=>x.id===id)||{n:'',a:'',c:'Food',d:'2026-10-31'};
const d=openDlg(`<h3>${id?'Edit':'Add'} expense</h3><form novalidate style="margin-top:16px"><div class="field"><label for="a1">Name</label><input id="a1" value="${esc(e.n)}"><span class="err"></span></div>
<div class="field"><label for="a2">Amount</label><input id="a2" type="number" step="0.01" value="${e.a}"><span class="err"></span></div><div class="field"><label for="a3">Category</label><select id="a3">${Object.keys(CATS).map(c=>`<option ${e.c===c?'selected':''}>${c}</option>`).join('')}</select></div>
<div class="field"><label for="a4">Date</label><input id="a4" type="date" value="${e.d}"></div><div class="field"><label for="a5">Notes (optional)</label><input id="a5" value="${esc(e.o||'')}"></div><div class="row sp"><button type="button" class="btn sec" onclick="dlg.close()">Cancel</button><button class="btn">Save</button></div></form>`);
$('form',d).onsubmit=ev=>{ev.preventDefault();const n=$('#a1').value.trim(),a=parseFloat($('#a2').value);let ok=1;
[[ '#a1',!n,'Please add a name'],['#a2',!(a>0),'Enter an amount above 0']].forEach(([s,b,m])=>{const i=$(s);i.setAttribute('aria-invalid',b);i.nextElementSibling.textContent=b?m:'';if(b)ok=0});if(!ok)return toast('Please fix the highlighted fields',1);
const r={id:id||Date.now(),n,a,c:$('#a3').value,d:$('#a4').value||e.d,o:$('#a5').value.trim()};id?S.ex[S.ex.findIndex(x=>x.id===id)]=r:S.ex.unshift(r);dlg.close();toast(id?'Expense updated':'Expense added');go()}}
function subForm(id){const s=S.subs.find(x=>x.id===id)||{n:'',p:'',cy:'Monthly',st:'Active',nx:'2026-11-30',e:'✨'};
const d=openDlg(`<h3>${id?'Edit':'Add'} subscription</h3><form novalidate style="margin-top:16px"><div class="field"><label for="b1">Service</label><input id="b1" value="${esc(s.n)}"><span class="err"></span></div><div class="field"><label for="b2">Price</label><input id="b2" type="number" step="0.01" value="${s.p}"><span class="err"></span></div>
<div class="field"><label for="b3">Billing cycle</label><select id="b3">${['Weekly','Monthly','Yearly'].map(c=>`<option ${s.cy===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label for="b6">Category</label><select id="b6">${Object.keys(CATS).map(c=>`<option ${(s.k||'Entertainment')===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label for="b4">Status</label><select id="b4">${['Active','Free trial','Cancelled'].map(c=>`<option ${s.st===c?'selected':''}>${c}</option>`).join('')}</select></div>
<div class="field"><label for="b5">Next payment</label><input id="b5" type="date" value="${s.nx}"></div><div class="row sp"><button type="button" class="btn sec" onclick="dlg.close()">Cancel</button><button class="btn">Save</button></div></form>`);
$('form',d).onsubmit=ev=>{ev.preventDefault();const n=$('#b1').value.trim(),p=parseFloat($('#b2').value);if(!n||!(p>=0)||$('#b2').value==='')return $('#b1').setAttribute('aria-invalid',!n),$('#b1').nextElementSibling.textContent=n?'':'Please add a service name',$('#b2').nextElementSibling.textContent='Enter a price',toast('Please fix the highlighted fields',1);
const r={id:id||Date.now(),n,p,cy:$('#b3').value,st:$('#b4').value,nx:$('#b5').value||'—',e:s.e,k:$('#b6').value};id?S.subs[S.subs.findIndex(x=>x.id===id)]=r:S.subs.push(r);dlg.close();toast('Subscription saved');go()}}
function budForm(){const d=openDlg(`<h3>Edit category limits</h3><form style="margin-top:16px">${Object.keys(S.bud).map(c=>`<div class="field"><label for="k${c}">${CATS[c]} ${c}</label><input id="k${c}" type="number" min="1" value="${S.bud[c]}"></div>`).join('')}<div class="row sp"><button type="button" class="btn sec" onclick="dlg.close()">Cancel</button><button class="btn">Save</button></div></form>`);
$('form',d).onsubmit=ev=>{ev.preventDefault();Object.keys(S.bud).forEach(c=>S.bud[c]=Math.max(1,+$('#k'+c).value||S.bud[c]));dlg.close();toast('Budgets updated');go()}}
function del(t,id){const d=openDlg(`<h3>Delete this item?</h3><p class="mu" style="margin:8px 0 20px">This can’t be undone.</p><div class="row sp"><button class="btn sec" onclick="dlg.close()">Keep it</button><button class="btn dng" id="ok">Yes, delete</button></div>`);
$('#ok',d).onclick=()=>{S[t]=S[t].filter(x=>x.id!==id);dlg.close();toast('Deleted');go()}}
function wipe(){const d=openDlg(`<h3>Clear all data?</h3><p class="mu" style="margin:8px 0 20px">Every expense and subscription will be removed.</p><div class="row sp"><button class="btn sec" onclick="dlg.close()">Cancel</button><button class="btn dng" id="ok">Clear data</button></div>`);$('#ok',d).onclick=()=>{S.ex=[];S.subs=[];dlg.close();toast('All data cleared');location.hash='expenses'}}
function cancelTrial(id){S.subs.find(s=>s.id===id).st='Cancelled';toast('Trial cancelled — no charge ♡');go()}
/* views */
const logo='<div class="logo">🎀 keikispace ♡</div>';
function landing(){return `<div class="land"><div class="row sp">${logo}<div class="row"><a class="btn sec sm" href="#login">Log in</a></div></div>
<section class="hero"><div class="spark deco" aria-hidden="true">🎀 ✦ 🌸 ✦ 🎀</div><h1>Stop treating your finances like a <em>scary math test.</em></h1>
<p class="mu" style="font-size:17px;max-width:560px;margin:0 auto 24px">Meet the modern KeikiSpace journal designed for your pockets and your peace of mind.</p>
<div class="row wrap" style="justify-content:center"><a class="btn" href="#register">Start Your Journey</a><a class="btn sec" href="#features">Explore Features</a></div></section>
<div class="card" style="max-width:760px;margin:0 auto 48px;background:var(--sec)"><div class="grid g3" style="margin-bottom:16px">${[['Spent','Rp 2.670.000'],['Left','Rp 2.930.000'],['Trials','2 ending']].map(c=>`<div class="card"><span class="mu">${c[0]}</span><div class="big">${c[1]}</div></div>`).join('')}</div>${line(S.hist)}</div>
<section id="features"><h2 style="text-align:center;margin-bottom:20px">Everything for a calmer wallet</h2><div class="grid g3">${[['🧾','Expense journal','Log spending in seconds and see where it goes.'],['🔁','Subscriptions','Every renewal in one tidy place.'],['⏳','Free trial alerts','Never get charged by surprise again.'],['🎯','Gentle budgets','Friendly nudges, never scolding.'],['📈','Pretty analytics','Charts that are actually readable.'],['🌸','Your space','Soft, private, and made for you.']].map(f=>`<div class="card"><div class="ico">${f[0]}</div><h3 style="margin:10px 0 4px">${f[1]}</h3><p class="mu">${f[2]}</p></div>`).join('')}</div></section>
<p class="mu" style="text-align:center;margin:40px 0 8px">Mindful spending, but make it aesthetic.</p><p class="mu" style="text-align:center">Your money, your space, your peace. ♡</p><footer class="mu" style="text-align:center;margin-top:32px;padding:24px 0;border-top:1px dashed var(--bd)"><span class="spark" aria-hidden="true">✿ ✦ 🎀 ✦ ✿</span><br>© 2026 keikispace ♡ · Made with care for your pockets</footer></div>`}
function auth(reg){return `<div class="auth"><div class="card"><a href="#landing" style="text-decoration:none">${logo}</a><div class="spark" aria-hidden="true">✦ ♡ ✦</div><h2 style="margin:8px 0 4px">${reg?'Create your space':'Welcome back'}</h2><p class="mu" style="margin-bottom:20px">${reg?'A few details and you’re in.':'Log in to your little money space.'}</p>
<form id="af" novalidate>${reg?'<div class="field"><label for="u1">Name</label><input id="u1" autocomplete="name"><span class="err"></span></div>':''}<div class="field"><label for="u2">Email</label><input id="u2" type="email" autocomplete="email"><span class="err"></span></div><div class="field"><label for="u3">Password</label><input id="u3" type="password" autocomplete="${reg?'new':'current'}-password"><span class="err"></span></div>
<button class="btn" style="width:100%" id="ab">${reg?'Create account':'Log in'}</button></form><p class="mu" style="margin-top:16px;text-align:center">${reg?'Have an account? <a href="#login">Log in</a>':'New here? <a href="#register">Create an account</a>'}</p></div></div>`}
function wireAuth(reg){$('#af').onsubmit=e=>{e.preventDefault();const v={n:reg?$('#u1').value.trim():'Keiki',e:$('#u2').value.trim(),p:$('#u3').value};let ok=1;
const chk=(id,bad,m)=>{const i=$(id);i.setAttribute('aria-invalid',!!bad);i.nextElementSibling.textContent=bad?m:'';if(bad)ok=0};
if(reg)chk('#u1',!v.n,'Please enter your name');chk('#u2',!/^\S+@\S+\.\S+$/.test(v.e),'Enter a valid email');chk('#u3',v.p.length<6,'At least 6 characters');if(!ok)return;
const b=$('#ab');b.disabled=true;b.textContent='Please wait…';setTimeout(()=>{S.user={name:v.n||v.e.split('@')[0],email:v.e};S.load=true;location.hash='dashboard';toast('Welcome in ♡');setTimeout(()=>{S.load=false;go()},700)},600)}}
function shell(r){const n=NAV.map(x=>`<a href="#${x[0]}" ${x[0]===r?'aria-current="page"':''}><span aria-hidden="true">${x[2]}</span>${x[1]}</a>`).join('');
return `<div id="app"><aside><nav class="nav" aria-label="Main">${logo}${n}</nav></aside><main><header class="top"><h1 style="font-size:22px">${TITLES[r]}</h1><div class="row"><button class="ibtn" aria-label="Notifications" onclick="toast('You have 2 trials ending soon')">🔔</button><button class="ibtn" aria-label="Profile menu" onclick="location.hash='preferences'">${esc(S.user.name[0].toUpperCase())}</button><button class="ibtn" aria-label="Log out" onclick="S.user=null;location.hash='landing'">↪</button></div></header><div class="view" id="pg">${P[r]()}</div></main>
<nav class="bnav" aria-label="Mobile">${NAV.filter(x=>x[0]!=='trials').map(x=>`<a href="#${x[0]}" ${x[0]===r?'aria-current="page"':''}><span aria-hidden="true">${x[2]}</span>${x[1].slice(0,5)}</a>`).join('')}</nav></div>`}
function go(){save();const r=location.hash.slice(1)||'landing',R=$('#root');
if(r==='landing'||r==='features'){R.innerHTML=landing();if(r==='features')$('#features').scrollIntoView();return}
if(r==='login'||r==='register'){R.innerHTML=auth(r==='register');return wireAuth(r==='register')}
if(!S.user){location.hash='login';return}
const k=P[r]?r:'dashboard';R.innerHTML=shell(k);
if(k==='expenses'){$('#q').oninput=e=>{S.f.q=e.target.value;const p=$('#pg');p.innerHTML=P.expenses();const q=$('#q');q.focus();q.setSelectionRange(99,99);rewire()};rewire()}
if(k==='preferences')$('#sv').onclick=()=>{const n=$('#pn').value.trim();if(!n)return toast('Name can’t be empty',1);S.user.name=n;S.cur=$('#cu').value;toast('Changes saved');go()}}
function rewire(){const c=$('#fc'),s=$('#fs');if(c)c.onchange=e=>{S.f.c=e.target.value;$('#pg').innerHTML=P.expenses();rewire();$('#q').oninput=qi};if(s)s.onchange=e=>{S.f.s=e.target.value;$('#pg').innerHTML=P.expenses();rewire();$('#q').oninput=qi}}
function qi(e){S.f.q=e.target.value;$('#pg').innerHTML=P.expenses();rewire();const q=$('#q');q.oninput=qi;q.focus();q.setSelectionRange(99,99)}
function rewire(){const rd=()=>{$('#pg').innerHTML=P.expenses();rewire()};
$('#q').oninput=e=>{S.f.q=e.target.value;rd();const q=$('#q');q.focus();q.setSelectionRange(99,99)};
[['fc','c'],['fs','s'],['fm','m']].forEach(([i,k])=>$('#'+i).onchange=e=>{S.f[k]=e.target.value;rd()})}
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(t){const b=$('#tip');b.textContent=t.dataset.tip;b.style.opacity=1}});
document.addEventListener('mousemove',e=>{const b=$('#tip');b.style.left=e.clientX+12+'px';b.style.top=e.clientY+12+'px'});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))$('#tip').style.opacity=0});
document.addEventListener('focusin',e=>{const t=e.target.closest('[data-tip]');if(t){const r=t.getBoundingClientRect(),b=$('#tip');b.textContent=t.dataset.tip;b.style.left=r.left+'px';b.style.top=r.bottom+8+'px';b.style.opacity=1}});
document.addEventListener('focusout',()=>$('#tip').style.opacity=0);
addEventListener('hashchange',go);go();
</script></body></html>
